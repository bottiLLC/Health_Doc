[project]
name = "health-cmms"
version = "0.1.0"
description = "身体保全マネジメントシステム（ヘルスケアCMMS）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.42.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "altair>=5.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["EXE002", "E501", "E402"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "altair.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
