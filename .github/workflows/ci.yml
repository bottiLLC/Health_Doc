name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check (ruff)
        run: uv run ruff check src tests app.py backup_manager.py

      - name: Strict type check (mypy)
        run: uv run mypy --strict src tests app.py backup_manager.py

      - name: Test with branch coverage (pytest)
        run: uv run pytest --cov=src --cov=backup_manager --cov-branch --cov-report=term-missing
